<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script>

    </script>

    <style>
        body {
            animation: bg 0.25s infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .backbackground {
            height: 70rem;
        }
        .background {
            animation: shake 0.4s linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .best {
            font-size: 5rem;
            font-weight: bolder;
            color: white;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            -webkit-text-stroke-width: 0.2rem;
            -webkit-text-stroke-color: black;
        }
        
        .dank {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 45rem;
            gap: 7rem;
            margin-top: -11rem;
        }
        .penguin {  
            width: 15rem;
            animation: spin 1.2s linear infinite;
        }      
        .side {
            height: 25rem;
            width: 25rem;
        }

        .dank2 {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7rem;
        }
        .mlg {
            height: 7rem;
            width: 20rem;
            animation: spin 0.7s linear infinite;
            margin: -10rem 0rem 0rem -10rem;
        }
        .MEMES {
            font-size: 5rem;
            font-weight: bolder;
            color: white;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            -webkit-text-stroke-width: 0.2rem;
            -webkit-text-stroke-color: black;
            margin: -8rem 0rem 0rem -2rem;
            animation: flashing 0.1s linear infinite;
        }
        .doritos {
            height: 8rem;
            width: 10rem;
            animation: spinr 2.5s linear infinite;
            margin: -10rem -11rem 0rem 11rem;
        }

        

        @keyframes spin {
            0%   {transform: rotate(0deg);}
            100% {transform: rotate(360deg);}
        }

        @keyframes spinr {
            0%   {transform: rotate(0deg);}
            100% {transform: rotate(-360deg);}
        }
        @keyframes shake {
            0%  {margin: 0rem;                  transform: rotate(0deg);}
            15% {margin: 0rem;                  transform: rotate(0deg);}
            25% {margin: 1rem 1rem -1rem -1rem; transform: rotate(2deg);}
            40% {margin: 1rem 1rem -1rem -1rem; transform: rotate(2deg);}
            50% {margin: 2rem 1rem -2rem -1rem; transform: rotate(0deg);}
            65% {margin: 2rem 1rem -2rem -1rem; transform: rotate(0deg);}
            75% {margin: 1rem 0rem -1rem 0rem;  transform: rotate(-1deg);}
            90% {margin: 1rem 0rem -1rem 0rem;  transform: rotate(-1deg);}
        }
        @keyframes bg {
            0%   {background-color:red}
            25%  {background-color:blue}
            50%  {background-color: yellow}
            75% {background-color:green}
            100% {background-color:red}
        }

        @keyframes flashing {
            0%  {opacity: 1;}
            70% {opacity: 1;}
            90% {opacity: 0;}
        }        

</style>

</head>
<body onload="load()">
    <div class="backbackground">
        <div class="background">
            <div class="best">
                BEST CLUB PENGUIN
            </div>
            <div class="dank">
                <img src="grassNo.png" class="side">
                <img src="penguinNo.png" class="penguin">
                <img src="grassNo.png" class="side">
            </div>
            <div class="dank2">
                <img src="mlgNo.png" class="mlg">
                <div class="MEMES">MEMES</div>
                <img src="doritoNo.png" class="doritos">
            </div>
        </div>
    </div>
    <audio controls autoplay loop>
        <source src="mlg.mp3" class="music"> 
    </audio>
</body>
</html>
